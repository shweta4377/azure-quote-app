apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-kvname
  namespace: default
spec:
  provider: azure
  secretObjects:
  - secretName: quote-app-secret
    type: Opaque
    data:
    - objectName: sql-connection-string
      key: sql-connection-string
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "WORKLOAD_IDENTITY_CLIENT_ID"  # Will be updated
    userAssignedIdentityID: "WORKLOAD_IDENTITY_CLIENT_ID"  # Will be updated
    keyvaultName: "kv-quoteapp-learning"  # Will be updated
    cloudName: ""
    objects: |
      array:
        - |
          objectName: sql-connection-string
          objectType: secret
          objectVersion: ""
    tenantId: "TENANT_ID"  # Will be updated
